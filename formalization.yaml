    framework: OpenAI Codex
    tool_setup: AI-assisted Lean implementation, proof development and repository tooling under human
      direction.
  - method: copilot
    framework: ChatGPT and Claude
    tool_setup: Mathematical discussion, planning, review assistance and documentation.
  notes: >-
    Human-directed, AI-assisted development. Exact model versions, costs and timings are omitted here
    rather than reconstructed from incomplete records.
status:
