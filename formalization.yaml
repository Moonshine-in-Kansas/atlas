version: v0.4
project:
  name: A constructive ATLAS of finite simple groups in Lean
  description: >-
    Explicit finite-group constructions with proofs of finiteness, order, simplicity and selected
    structural properties. The public release includes eight families and fifteen sporadic entries.
    Its main Comparator interface states existence with exact orders and simplicity; four strengthened
    statements add invariants distinguishing specified same-order pairs.
  authors:
  - Gerald Höhn
  responsible_maintainers:
  - Gerald Höhn
  license: ATLAS Research and Attribution License 1.0 (see LICENSE and LICENSING.md)
sources:
- title: A constructive ATLAS of finite simple groups in Lean
  authors:
  - Gerald Höhn
  id: atlas_research_note.pdf
  type: research note
  relationship: other
  note: >-
    Project overview accompanying this repository, not a claim that the development is a line-by-line
    formalization of one paper. Construction-specific sources and adaptations should be credited individually
    when expanding this source list.
