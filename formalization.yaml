fidelity:
  divergences: >-
    The Comparator interface deliberately hides the constructions behind existential quantifiers.
    It does not certify a general recognition theorem or classification exhaustiveness. Group labels
    are navigation labels, not extra hypotheses. Construction-specific statements and comparison maps
    remain in the substantive ATLAS development. The added invariants distinguish the specified same-order
    pairs, without asserting uniqueness among all finite groups.
review:
  status: self-assessed
  notes: >-
    Human-directed development with AI-assisted review. The repository reports successful sandboxed
    Comparator checks for the declarations indexed here. No independent human peer review of these
    reference specifications is claimed. This metadata summarizes recorded checks; it is not an independent
    rerun.
verification:
  reports:
  - kind: existence
    file: verification/existence/RESULTS.md
    passed: 23
    total: 23
  - kind: strengthened-existence
    file: verification/existence/discriminators/RESULTS.md
    passed: 4
    total: 4
  permitted_axioms:
  - propext
  - Quot.sound
  - Classical.choice
  definition_holes: []
  checks:
  - statement comparison
  - permitted-axiom check
  - standard Lean kernel replay
  reproduction_guides:
  - verification/existence/README.md
  - verification/existence/discriminators/README.md
  notes: >-
    The recorded new checks use Comparator with the standard Lean kernel, not Nanoda. The older audit
    and Nanoda evidence are described separately in AUDIT.md. The saved per-entry files are evidence
    artifacts; reproduce them using the preparation and sandbox instructions, not by treating each
    directory as a standalone Lake project. The per-result sorry counts exclude deliberate Challenge
    placeholders. No repository-wide source-text sorry count or exact per-theorem axiom inventory
    is asserted here.
