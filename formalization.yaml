    or noncommutativity, over the precise parameter ranges in the Challenge modules. The four strengthened
    contracts assert order, simplicity, noncommutativity and an extra invariant together for one witness.
    These 27 declarations are the selected public Comparator interface; they are not a count of distinct
    groups and not an inventory of every theorem in Atlas. See CATALOGUE.md for the construction-specific
    interfaces.
