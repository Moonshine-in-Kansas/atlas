fidelity:
  divergences: The Comparator interface deliberately hides the constructions behind
    existential quantifiers. It does not certify a general recognition theorem or
    classification exhaustiveness. Group labels are navigation labels, not extra hypotheses.
    Construction-specific statements and comparison maps remain in the substantive
    ATLAS development. The added invariants distinguish the specified same-order pairs,
    without asserting uniqueness among all finite groups.
